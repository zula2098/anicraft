name: Android backend probe

on:
  push:
    branches: [android-port]
    paths:
      - "android/probe/**"
      - ".github/workflows/android-probe.yml"
  pull_request:
    paths:
      - "android/probe/**"
      - ".github/workflows/android-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arm64:
    name: Android ARM64 native library
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust and Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          # Explicitly avoid the retired "tools" SDK package pulled in by older
          # setup-android action defaults.
          packages: platform-tools

      - name: Install Android NDK
        run: sdkmanager --install "ndk;27.3.13750724"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build GameActivity backend for ARM64
        run: cargo ndk -t arm64-v8a build --release --manifest-path android/probe/Cargo.toml

      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: anicraft-android-probe-arm64
          path: android/probe/target/aarch64-linux-android/release/libmain.so
          if-no-files-found: error
          retention-days: 7
