name: Android backend probe

on:
  push:
    branches: [android-port, feat/fla-vector-export]
    paths:
      - "android/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "crates/**"
      - ".github/workflows/android-probe.yml"
  pull_request:
    paths:
      - "android/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "crates/**"
      - ".github/workflows/android-probe.yml"
  workflow_dispatch:

# Keep only the newest Android build for a branch; successive commits should not
# compile the same large Rust dependency graph concurrently.
concurrency:
  group: android-probe-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  arm64:
    name: Android ARM64 native library
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust and Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          # Explicitly avoid the retired "tools" SDK package pulled in by older
          # setup-android action defaults.
          packages: platform-tools

      - name: Install Android NDK
        run: sdkmanager --install "ndk;27.3.13750724"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build GameActivity backend for ARM64
        run: cargo ndk -t arm64-v8a build --release --manifest-path Cargo.toml --lib --no-default-features --features android

      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: anicraft-android-arm64
          path: target/aarch64-linux-android/release/libmain.so
          if-no-files-found: error
          retention-days: 7

  debug-apk:
    name: Package Android debug APK
    runs-on: ubuntu-latest
    needs: arm64
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Rust and Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK platform and NDK
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.3.13750724"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Assemble debug APK
        run: gradle -p android :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: anicraft-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
