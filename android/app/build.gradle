plugins {
    id "com.android.application"
}

def repoRoot = rootProject.projectDir.parentFile
def rustOutput = new File(repoRoot, "target/aarch64-linux-android/release/libmain.so")
def generatedJni = layout.buildDirectory.dir("generated/rustJniLibs")

android {
    namespace "org.anicraft.app"
    compileSdk 36
    ndkVersion "27.3.13750724"

    defaultConfig {
        applicationId "org.anicraft.app"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "0.1.0"
    }

    sourceSets {
        main {
            jniLibs.srcDir(generatedJni)
        }
    }

    buildFeatures {
        prefab true
    }
}

dependencies {
    // GameActivity exposes AndroidX Core window-insets types in its Java API.
    implementation "androidx.core:core:1.16.0"
    // GameActivity extends AppCompatActivity; its public Java type must be on the compile classpath.
    implementation "androidx.appcompat:appcompat:1.7.1"
    implementation "androidx.games:games-activity:4.4.2"
}

def buildRustAndroid = tasks.register("buildRustAndroid", Exec) {
    workingDir repoRoot
    commandLine "cargo", "ndk", "-t", "arm64-v8a", "build", "--release",
        "--manifest-path", "Cargo.toml", "--lib", "--no-default-features", "--features", "android"
    inputs.file(new File(repoRoot, "Cargo.toml"))
    inputs.file(new File(repoRoot, "Cargo.lock"))
    inputs.dir(new File(repoRoot, "src"))
    inputs.dir(new File(repoRoot, "crates"))
    outputs.file(rustOutput)
}

def stageRustLibrary = tasks.register("stageRustLibrary", Copy) {
    dependsOn(buildRustAndroid)
    from(rustOutput)
    into(generatedJni.map { new File(it.asFile, "arm64-v8a") })
}

tasks.named("preBuild").configure {
    dependsOn(stageRustLibrary)
}
